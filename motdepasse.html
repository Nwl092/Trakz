<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau mot de passe · Trakz</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--encre:#12233A;--papier:#F7F3EC;--carte:#FFF;--signal:#2F5573;--trait:#E3DCC9;--doux:#66605A;--alerte:#9E2B2B}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--papier);color:var(--encre);
    font-family:"Public Sans",system-ui,sans-serif;font-size:16px;line-height:1.6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .marque{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;
    letter-spacing:-.02em;text-decoration:none;color:var(--encre);margin-bottom:22px}
  .boite{width:100%;max-width:400px;background:var(--carte);border:1px solid var(--trait);
    border-radius:20px;padding:30px 26px}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-size:25px;font-weight:800;
    letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}
  .sous{color:var(--doux);font-size:15px;margin:0 0 24px}
  label{display:block;font-size:13.5px;color:var(--doux);margin:0 0 6px}
  input{width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid var(--trait);
    background:var(--carte);font-size:16px;color:var(--encre);font-family:inherit}
  input:focus{outline:none;border-color:var(--encre)}
  .champ{margin-bottom:16px}
  button{width:100%;padding:14px 0;border-radius:12px;border:1.5px solid var(--encre);
    background:var(--encre);color:var(--papier);font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{border-radius:11px;padding:12px 14px;font-size:14.5px;line-height:1.5;margin-bottom:18px;display:none}
  .msg.err{display:block;background:#FBEBD2;border:1px solid var(--alerte);color:#7F4310}
  .msg.ok{display:block;background:#E4EFE8;border:1px solid #1E6B4E;color:#14563E}
  .liens{margin-top:20px;font-size:14px}
  .liens a{color:var(--doux)}
  :focus-visible{outline:2.5px solid var(--signal);outline-offset:3px}
</style>
</head>
<body>

<a class="marque" href="index.html" id="mq">Trakz</a>

<div class="boite">
  <h1>Nouveau mot de passe</h1>
  <p class="sous">Choisis-en un d'au moins huit caractères.</p>
  <div class="msg" id="msg"></div>
  <form id="form">
    <div class="champ">
      <label for="mdp">Nouveau mot de passe</label>
      <input id="mdp" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="champ">
      <label for="mdp2">Répète-le</label>
      <input id="mdp2" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <button type="submit" id="valider">Enregistrer</button>
  </form>
  <div class="liens"><a href="connexion.html">← Retour à la connexion</a></div>
</div>

<script src="config.js?v=3"></script>
<script>
/* Si config.js ne se charge pas, on ne fait SURTOUT pas semblant : basculer
   en mode test masquerait la vraie panne. On signale, et on bloque. */
if(typeof window.CONFIG === "undefined"){
  window.CONFIG = { nom:"Trakz", prix:"29", devise:"\u20AC", email:"",
                    lienPaiement:"", modeTest:false, comptesTest:[],
                    supabaseUrl:"", supabaseKey:"", _manquant:true };
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const C = window.CONFIG || {};
const $ = id => document.getElementById(id);
if(C.nom){ $("mq").textContent = C.nom; document.title = "Nouveau mot de passe · " + C.nom; }

function dire(t, type){ const m=$("msg"); m.textContent=t; m.className="msg "+(type||"err"); }

let sb = null;
if(C.modeTest){
  dire("En mode test, le mot de passe se modifie directement dans config.js.");
  $("valider").disabled = true;
} else if(!C.supabaseUrl || !C.supabaseKey || typeof supabase === "undefined"){
  dire("Le site n'est pas encore relié à sa base de comptes.");
  $("valider").disabled = true;
} else {
  sb = supabase.createClient(C.supabaseUrl, C.supabaseKey);
  /* Le lien reçu par e-mail ouvre une session temporaire : sans elle,
     impossible de changer le mot de passe. */
  sb.auth.getSession().then(({ data }) => {
    if(!data || !data.session){
      dire("Ce lien n'est plus valable. Redemande un lien depuis la page de connexion.");
      $("valider").disabled = true;
    }
  });
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if(!sb) return;
  const a = $("mdp").value, b = $("mdp2").value;
  if(a !== b){ dire("Les deux mots de passe ne sont pas identiques."); return; }
  if(a.length < 8){ dire("Il faut au moins huit caractères."); return; }
  $("valider").disabled = true;
  try{
    const { error } = await sb.auth.updateUser({ password: a });
    if(error) throw error;
    dire("Mot de passe enregistré. Redirection vers l'application…", "ok");
    setTimeout(() => location.replace("app.html"), 1400);
  }catch(err){
    dire("Enregistrement impossible : " + ((err && err.message) || ""));
    $("valider").disabled = false;
  }
});
</script>
</body>
</html>
