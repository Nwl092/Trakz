<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérification de l'installation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root{--encre:#12233A;--papier:#F7F3EC;--carte:#FFF;--bon:#1D6E4F;--mauvais:#9E2B2B;--trait:#E3DCC9;--doux:#66605A}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--papier);color:var(--encre);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.6;padding:26px 20px 60px}
  .boite{max-width:560px;margin:0 auto}
  h1{font-size:24px;letter-spacing:-.02em;margin:0 0 6px}
  .sous{color:var(--doux);margin:0 0 26px}
  .ligne{background:var(--carte);border:1px solid var(--trait);border-radius:14px;
    padding:16px 18px;margin-bottom:10px;display:flex;gap:13px;align-items:flex-start}
  .pastille{flex:0 0 22px;width:22px;height:22px;border-radius:50%;margin-top:2px;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
  .ok .pastille{background:var(--bon)}
  .ko .pastille{background:var(--mauvais)}
  .ligne b{display:block;font-size:15.5px}
  .ligne span{font-size:14px;color:var(--doux)}
  .verdict{border-radius:16px;padding:20px;margin:22px 0;font-size:16px;line-height:1.55}
  .verdict.ok{background:#E4EFE8;border:1.5px solid var(--bon);color:#14563E}
  .verdict.ko{background:#FBEBD2;border:1.5px solid var(--mauvais);color:#7F4310}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  a.btn{display:inline-block;padding:12px 20px;border-radius:11px;border:1.5px solid var(--encre);
    background:var(--encre);color:var(--papier);text-decoration:none;font-weight:600;font-size:15px}
  a.btn.creux{background:transparent;color:var(--encre)}
  code{background:var(--papier);border-radius:5px;padding:1px 6px;font-size:14px}
</style>
</head>
<body>
<div class="boite">
  <h1>Vérification de l'installation</h1>
  <p class="sous">Cette page contrôle que tous les fichiers sont bien en place.</p>
  <div id="resultats"></div>
  <div id="verdict"></div>
  <div class="actions">
    <a class="btn" href="connexion.html">Aller à la connexion</a>
    <a class="btn creux" href="index.html">Voir la page de vente</a>
  </div>
</div>

<script src="config.js?v=3"></script>
<script>
/* Si config.js ne se charge pas, on ne fait SURTOUT pas semblant : basculer
   en mode test masquerait la vraie panne. On signale, et on bloque. */
if(typeof window.CONFIG === "undefined"){
  window.CONFIG = { nom:"Trakz", prix:"29", devise:"\u20AC", email:"",
                    lienPaiement:"", modeTest:false, comptesTest:[],
                    supabaseUrl:"", supabaseKey:"", _manquant:true };
}
</script>
<script>
const controles = [];
function test(nom, ok, detail){ controles.push({nom:nom, ok:!!ok, detail:detail}); }

/* 1 — config.js chargé ? */
const chargé = typeof window.CONFIG !== "undefined" && !window.CONFIG._manquant;
test("Le fichier config.js est en ligne",
     chargé,
     chargé ? "Trouvé au bon endroit."
            : "INTROUVABLE. C'est la cause de ton problème. Trois vérifications : le fichier " +
              "s'appelle-t-il bien config.js et non config.js.txt ? Est-il au même niveau que cette page ? " +
              "As-tu redéployé le dossier entier ?");

const C = window.CONFIG || {};

/* 2 — un mode d'accès est actif ? */
const modeTest = C.modeTest === true;
const supa = !!(C.supabaseUrl && C.supabaseKey);
test("Un mode d'accès est activé",
     modeTest || supa,
     modeTest ? "Mode test actif — pratique pour essayer, mais il ne protège rien."
              : supa ? "Base de comptes Supabase renseignée."
                     : "Ni mode test, ni Supabase. Ouvre config.js et mets modeTest à true.");

/* 3 — que contient exactement le config.js en ligne ? */
test("Le mode test est désactivé",
     C.modeTest !== true,
     C.modeTest === true
       ? "modeTest vaut encore true : le site n'accepte que les comptes écrits dans config.js, "
         + "pas ceux de Supabase. Mets-le à false, redéploie, puis recharge en vidant le cache."
       : "modeTest vaut false — les comptes viennent bien de Supabase.");

test("L'adresse du projet Supabase est renseignée",
     !!C.supabaseUrl,
     C.supabaseUrl ? C.supabaseUrl : "Vide. Colle l'adresse du projet dans config.js.");

test("La clé publique est renseignée",
     !!C.supabaseKey,
     C.supabaseKey
       ? "Présente (" + String(C.supabaseKey).slice(0,12) + "…) — "
         + (/^sb_secret|service_role/.test(String(C.supabaseKey))
            ? "ATTENTION : cela ressemble à une clé secrète. Remplace-la par la clé publique."
            : "elle a bien la forme d'une clé publique.")
       : "Vide. Colle la clé publique dans config.js.");

/* 4 — comptes de test disponibles ? */
if(modeTest){
  const liste = C.comptesTest || [];
  test("Au moins un compte de test existe",
       liste.length > 0,
       liste.length ? "Identifiant : " + liste[0].email + " — mot de passe : " + liste[0].mdp
                    : "Aucun compte dans comptesTest.");
}

/* 4 — les autres fichiers répondent ? */
const fichiers = ["index.html","connexion.html","app.html","motdepasse.html"];
let restants = fichiers.length;

function afficher(){
  document.getElementById("resultats").innerHTML = controles.map(function(c){
    return '<div class="ligne ' + (c.ok ? "ok" : "ko") + '">' +
      '<div class="pastille">' + (c.ok ? "✓" : "!") + '</div>' +
      '<div><b>' + c.nom + '</b><span>' + c.detail + '</span></div></div>';
  }).join("");

  const rates = controles.filter(function(c){ return !c.ok; });
  const v = document.getElementById("verdict");
  if(!rates.length){
    v.className = "verdict ok";
    v.innerHTML = "<strong>Tout est en place.</strong> Tu peux aller sur la page de connexion et entrer tes identifiants.";
  } else {
    v.className = "verdict ko";
    v.innerHTML = "<strong>" + rates.length + " point" + (rates.length>1?"s":"") +
      " à corriger.</strong> Le plus souvent, tout se règle en redéposant sur Netlify " +
      "<em>le contenu du dossier</em> — les fichiers doivent se retrouver à la racine du site, " +
      "avec <code>index.html</code> et <code>config.js</code> côte à côte.";
  }
}

fichiers.forEach(function(f){
  fetch(f, {method:"HEAD", cache:"no-store"})
    .then(function(r){ test("Le fichier " + f + " est en ligne", r.ok, r.ok ? "Répond correctement." : "Réponse " + r.status + " — fichier absent du site."); })
    .catch(function(){ test("Le fichier " + f + " est en ligne", false, "Aucune réponse. Ouvre cette page depuis l'adresse du site, pas depuis ton disque."); })
    .finally(function(){ if(--restants === 0) afficher(); });
});

afficher();
</script>
</body>
</html>
