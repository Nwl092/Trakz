<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--encre:#12233A;--papier:#F7F3EC;--carte:#FFF;--signal:#2F5573;--trait:#E3DCC9;--doux:#66605A;--alerte:#9E2B2B}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--papier);color:var(--encre);
    font-family:"Public Sans",system-ui,sans-serif;font-size:16px;line-height:1.6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  a{color:var(--encre)}
  .marque{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;
    letter-spacing:-.02em;text-decoration:none;margin-bottom:22px}
  .boite{width:100%;max-width:400px;background:var(--carte);border:1px solid var(--trait);
    border-radius:20px;padding:30px 26px}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:800;
    letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}
  .sous{color:var(--doux);font-size:15px;margin:0 0 24px}
  label{display:block;font-size:13.5px;color:var(--doux);margin:0 0 6px}
  input{width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid var(--trait);
    background:var(--carte);font-size:16px;color:var(--encre);font-family:inherit}
  input:focus{outline:none;border-color:var(--encre)}
  .champ{margin-bottom:16px}
  button{width:100%;padding:14px 0;border-radius:12px;border:1.5px solid var(--encre);
    background:var(--encre);color:var(--papier);font-size:16px;font-weight:600;
    font-family:inherit;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  button.creux{background:transparent;color:var(--encre);margin-top:10px;font-weight:500}
  .msg{border-radius:11px;padding:12px 14px;font-size:14.5px;line-height:1.5;margin-bottom:18px;display:none}
  .msg.err{display:block;background:#FBEBD2;border:1px solid var(--alerte);color:#7F4310}
  .msg.ok{display:block;background:#E4EFE8;border:1px solid #1E6B4E;color:#14563E}
  .liens{margin-top:20px;font-size:14px;color:var(--doux);display:flex;
    justify-content:space-between;gap:12px;flex-wrap:wrap}
  .liens a{color:var(--doux)}
  .pied{margin-top:22px;font-size:13.5px;color:var(--doux);text-align:center;max-width:400px}
  :focus-visible{outline:2.5px solid var(--signal);outline-offset:3px}
  .bandeau{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--alerte);color:#fff;
    padding:9px 16px;font-size:13px;line-height:1.4;text-align:center;font-weight:500}
  body.avec-bandeau{padding-top:64px}
</style>
</head>
<body>

<a class="marque" href="index.html" id="mq">Trakz</a>

<div class="boite">
  <h1 id="ttl">Connexion</h1>
  <p class="sous" id="sst">Entre l'identifiant reçu après ton achat.</p>

  <div class="msg" id="msg"></div>

  <form id="form">
    <div class="champ">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="email" required>
    </div>
    <div class="champ" id="champMdp">
      <label for="mdp">Mot de passe</label>
      <input id="mdp" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="valider">Se connecter</button>
  </form>

  <button class="creux" id="basculer">Mot de passe oublié</button>

  <div class="liens">
    <a href="index.html">← Retour au site</a>
    <a id="aide" href="#">Besoin d'aide</a>
  </div>
</div>

<p class="pied" id="etat" style="font-size:12.5px;opacity:.85"></p>
<p class="pied">Pas encore de compte ? L'accès s'obtient depuis <a href="index.html#prix">la page du pack</a>.</p>

<script src="config.js?v=3"></script>
<script>
/* Si config.js ne se charge pas, on ne fait SURTOUT pas semblant : basculer
   en mode test masquerait la vraie panne. On signale, et on bloque. */
if(typeof window.CONFIG === "undefined"){
  window.CONFIG = { nom:"Trakz", prix:"29", devise:"\u20AC", email:"",
                    lienPaiement:"", modeTest:false, comptesTest:[],
                    supabaseUrl:"", supabaseKey:"", _manquant:true };
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const C = window.CONFIG || {};
const $ = id => document.getElementById(id);
if(C.nom){ $("mq").textContent = C.nom; document.title = "Connexion · " + C.nom; }
if(C.email) $("aide").href = "mailto:" + C.email;


/* Dit précisément ce qui bloque, plutôt qu'un message générique. */
function diagnostic(){
  if(typeof window.CONFIG === "undefined")
    return "Le fichier config.js n'a pas été chargé. Il doit se trouver au même niveau que cette page. "+
           "Si tu viens de le redéposer, recharge en vidant le cache.";
  const c = window.CONFIG;
  if(c._manquant)
    return "Le fichier config.js n'est pas en ligne. Vérifie trois choses : "+
           "qu'il s'appelle bien config.js et non config.js.txt, qu'il est déposé "+
           "à côté de connexion.html, et que tu as bien redéployé le dossier entier.";
  if(c.modeTest) return null;
  if(!c.supabaseUrl || !c.supabaseKey)
    return "config.js est bien chargé, mais ni le mode test ni la base de comptes ne sont activés. "+
           "Ouvre config.js et mets modeTest à true pour essayer tout de suite.";
  return null;
}

/* Ligne d'état : dit d'où vient la configuration et quel mode est actif.
   Sans elle, impossible de distinguer « mauvais mot de passe » de
   « le site ne lit pas le bon fichier ». */
(function(){
  const e = document.getElementById("etat");
  if(!e) return;
  const c = window.CONFIG || {};
  const source = c._manquant ? "config.js INTROUVABLE" : "config.js chargé";
  const m = c._manquant ? "aucun accès possible"
          : c.modeTest ? "mode test (comptes locaux)"
          : (c.supabaseUrl && c.supabaseKey) ? "comptes Supabase"
          : "aucun mode configuré";
  e.textContent = source + " · " + m;
})();

let mode = "connexion";           /* connexion · oubli */
let sb = null;

function dire(texte, type){
  const m = $("msg");
  m.textContent = texte;
  m.className = "msg " + (type || "err");
}
function taire(){ $("msg").className = "msg"; }

/* --- Mode test : comptes écrits dans config.js --------------------------- */
const CLE_TEST = "acces-mode-test";
if(C.modeTest){
  const b = document.createElement("div");
  b.className = "bandeau";
  b.textContent = "Mode test — les identifiants sont visibles dans config.js. À désactiver avant la première vente.";
  document.body.appendChild(b);
  document.body.classList.add("avec-bandeau");
  try{
    if(localStorage.getItem(CLE_TEST)) location.replace("app.html");
  }catch(e){}
  const cpt = (C.comptesTest || [])[0];
  if(cpt){
    $("sst").innerHTML = "Identifiant : <strong>" + cpt.email +
      "</strong><br>Mot de passe : <strong>" + cpt.mdp + "</strong>";
  }
}

/* --- Vérification de la configuration ------------------------------------ */
if(C.modeTest){
  /* rien à vérifier : la connexion se fait sur la liste locale */
} else if(diagnostic()){
  dire(diagnostic(), "err");
  $("valider").disabled = true;
} else if(typeof supabase === "undefined"){
  dire("La librairie d'authentification n'a pas pu être chargée. Vérifie ta connexion et recharge la page.", "err");
  $("valider").disabled = true;
} else {
  sb = supabase.createClient(C.supabaseUrl, C.supabaseKey);
  /* déjà connecté ? on file directement à l'application */
  sb.auth.getSession().then(({ data }) => {
    if(data && data.session) location.replace("app.html");
  });
}

/* --- Bascule connexion / mot de passe oublié ----------------------------- */
$("basculer").addEventListener("click", () => {
  taire();
  if(mode === "connexion"){
    mode = "oubli";
    $("ttl").textContent = "Mot de passe oublié";
    $("sst").textContent = "Indique ton adresse : tu recevras un lien pour en choisir un nouveau.";
    $("champMdp").style.display = "none";
    $("mdp").required = false;
    $("valider").textContent = "Envoyer le lien";
    $("basculer").textContent = "Revenir à la connexion";
  } else {
    mode = "connexion";
    $("ttl").textContent = "Connexion";
    $("sst").textContent = "Entre l'identifiant reçu après ton achat.";
    $("champMdp").style.display = "";
    $("mdp").required = true;
    $("valider").textContent = "Se connecter";
    $("basculer").textContent = "Mot de passe oublié";
  }
});

/* --- Envoi ---------------------------------------------------------------- */
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if(!C.modeTest && !sb) return;
  taire();
  const email = $("email").value.trim();
  const mdp   = $("mdp").value;
  $("valider").disabled = true;
  const libelle = $("valider").textContent;
  $("valider").textContent = "…";

  try{
    if(C.modeTest){
      if(mode === "oubli"){
        dire("En mode test, le mot de passe se change directement dans config.js.", "ok");
      } else {
        const liste = C.comptesTest || [];
        const ok = liste.some(function(c){
          return String(c.email).toLowerCase() === email.toLowerCase() && String(c.mdp) === mdp;
        });
        if(!ok){ dire("Adresse ou mot de passe incorrect. Ils sont définis dans config.js."); }
        else {
          try{ localStorage.setItem(CLE_TEST, email); }catch(e){}
          location.replace("app.html");
          return;
        }
      }
    }
    else if(mode === "oubli"){
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + "/motdepasse.html"
      });
      if(error) throw error;
      dire("Si un compte existe pour cette adresse, un lien vient de partir. Pense à regarder tes indésirables.", "ok");
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: email, password: mdp });
      if(error) throw error;
      location.replace("app.html");
      return;
    }
  } catch(err){
    const m = String((err && err.message) || "");
    if(/invalid login credentials/i.test(m))
      dire("Adresse ou mot de passe incorrect. Vérifie ta saisie, ou utilise « Mot de passe oublié ».");
    else if(/email not confirmed/i.test(m))
      dire("Ton adresse n'est pas encore confirmée. Ouvre le lien reçu par e-mail, puis reviens ici.");
    else if(/rate limit|too many/i.test(m))
      dire("Trop de tentatives. Attends une minute avant de réessayer.");
    else
      dire("La connexion a échoué : " + m);
  } finally {
    $("valider").disabled = false;
    $("valider").textContent = libelle;
  }
});
</script>
</body>
</html>
